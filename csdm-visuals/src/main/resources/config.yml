# Activar después de instalar PacketEvents 2.14.0 y preparar la prueba con dos cuentas.
enabled: false
worlds: [lobby]
other-player-scale: 0.3
fullsize-permission: csdm.visual.fullsize
# Detecta también cambios de permisos/rango sin reiniciar.
refresh-ticks: 20

# Bedrock observa la escala real hasta validar traducción de paquetes, cámara y selección.
bedrock-viewers-enabled: false

# Independiente de la escala: sustituye ✦ por * y • por | solo para Bedrock.
# Conserva acentos, colores y estilos. /csdmvisuals recarga esta opción.
bedrock-text:
  enabled: true
