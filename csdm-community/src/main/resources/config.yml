functional-ranks:
  usuario:
    group: "csdm-usuario"
    display-name: "Usuario"
    prefix: "<gray><bold>USUARIO</bold></gray> <dark_gray>•</dark_gray> "
    priority: 100
    permissions:
      - "csdm.ranks.view"
      - "csdm.medals.view"
  personalidad:
    group: "csdm-personalidad"
    display-name: "Personalidad"
    prefix: "<gradient:#FFD166:#FF62C7><bold>PERSONALIDAD</bold></gradient> <dark_gray>•</dark_gray> "
    priority: 200
    inherits: ["csdm-usuario"]
    permissions:
      - "csdm.command.fly"
      - "csdm.admin.spawn"
      - "csdm.maintenance.bypass"
  mod:
    group: "csdm-mod"
    display-name: "Moderación"
    prefix: "<blue><bold>MOD</bold></blue> <dark_gray>•</dark_gray> "
    priority: 300
    inherits: ["csdm-usuario"]
    permissions:
      - "csdm.admin.bypass"
      - "csdm.maintenance.bypass"
      - "csdm.staffmode.use"
      - "csdm.staffmode.see"
      - "csdm.sanctions.warn"
      - "csdm.sanctions.kick"
      - "csdm.sanctions.tempban"
  coordinacion:
    group: "csdm-coordinacion"
    display-name: "Coordinación"
    prefix: "<aqua><bold>COORDINACIÓN</bold></aqua> <dark_gray>•</dark_gray> "
    priority: 400
    inherits: ["csdm-mod"]
    permissions:
      - "csdm.sanctions.ban"
      - "csdm.sanctions.pardon"
      - "csdm.ranks.manage"
      - "csdm.medals.manage"
  direccion:
    group: "csdm-direccion"
    display-name: "Dirección"
    prefix: "<gradient:#00E5FF:#9B5CFF><bold>DIRECCIÓN</bold></gradient> <dark_gray>•</dark_gray> "
    priority: 500
    inherits: ["csdm-coordinacion"]
    permissions:
      - "csdm.*"

prestige-ranks:
  elite:
    group: "csdm-prestigio-elite"
    display-name: "Élite"
    prefix: "<aqua><bold>ÉLITE</bold></aqua> <dark_gray>•</dark_gray> "
    priority: 100
  leyenda:
    group: "csdm-prestigio-leyenda"
    display-name: "Leyenda"
    prefix: "<light_purple><bold>LEYENDA</bold></light_purple> <dark_gray>•</dark_gray> "
    priority: 200
  inmortal:
    group: "csdm-prestigio-inmortal"
    display-name: "Inmortal"
    prefix: "<gold><bold>INMORTAL</bold></gold> <dark_gray>•</dark_gray> "
    priority: 300

nametags:
  # Rango funcional antes del nick y prestigio despues del nick.
  enabled: true
  show-functional: true
  show-prestige: true
  separator: "<dark_gray> • </dark_gray>"
  # Tambien detecta cambios hechos directamente con comandos de LuckPerms.
  refresh-ticks: 100

storage:
  # MVP local. La siguiente fase sustituira este repositorio por el endpoint interno de CSDM.
  type: "yaml"

presence-messages:
  enabled: true
  join: "<dark_gray>✦</dark_gray> <aqua>El Archivo ha reconocido a <white><player></white>.</aqua><medal>"
  first-join: "<gradient:#00E5FF:#B86BFF><bold><player> entra por primera vez al Archivo CSDM.</bold></gradient>"
  quit: "<dark_gray>✦ <gray><player> abandono el Archivo.</gray></dark_gray><medal>"
  show-featured-medal: true
  join-rank-overrides:
    direccion: "<gradient:#00E5FF:#B86BFF><bold>✦ DIRECCIÓN · <player> ha entrado al Archivo.</bold></gradient>"
    coordinacion: "<aqua><bold>⚙ COORDINACIÓN · <player></bold> ha entrado a la terminal.</aqua>"
    mod: "<blue><bold>◆ MOD · <player></bold> esta en linea.</blue>"
    personalidad: "<gradient:#FFD166:#FF62C7><bold>✦ PERSONALIDAD · <player> visita el Archivo.</bold></gradient>"
  quit-rank-overrides:
    direccion: "<dark_gray>✦ <player> cerro la sesión de Dirección.</dark_gray>"
    coordinacion: "<dark_gray>⚙ COORDINACIÓN · <player> abandono la terminal.</dark_gray>"
